name: Lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject unfinished or project-local axiom declarations
        run: python3 .github/scripts/audit_lean_sources.py

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit v1.0 core theorem names and axioms
        run: lake env lean DistinctionSelfReference/FreezeAudit.lean

      - name: Export checked root module once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-export
          lake env leanexport DistinctionSelfReference > proof-export/solution.export
          test -s proof-export/solution.export

      - name: Upload proof export
        uses: actions/upload-artifact@v4
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export/solution.export
          if-no-files-found: error
          compression-level: 1

  kernel-replay:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download proof export
        uses: actions/download-artifact@v5
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export

      - name: Install restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
            apt-get install -yq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true

      - name: Kernel replay from exact build export
        run: lake check --from-export=proof-export/solution.export

  bundled-checker:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - checker: lean-paranoid
            runner: ubuntu-latest
          - checker: lean4lean
            runner: ubuntu-latest
          - checker: con-leche
            runner: ubuntu-latest
          - checker: con-ron
            runner: ubuntu-latest
    name: bundled-checker (${{ matrix.checker }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Download proof export
        uses: actions/download-artifact@v5
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export

      - name: Install restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
            apt-get install -yq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true

      - name: Replay exact export with ${{ matrix.checker }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          SYSROOT="$(dirname "$(dirname "$(elan which lean)")")"
          EXPORT="$(realpath proof-export/solution.export)"
          CHECKER="${{ matrix.checker }}"

          sandbox() {
            bwrap \
              --ro-bind / / \
              --tmpfs /home \
              --tmpfs /root \
              --tmpfs /run/user \
              --tmpfs /tmp \
              --dir /tmp/home \
              --dev /dev \
              --proc /proc \
              --clearenv \
              --setenv HOME /tmp/home \
              --setenv LEAN_ABORT_ON_PANIC 1 \
              --ro-bind "$SYSROOT" "$SYSROOT" \
              --ro-bind "$EXPORT" "$EXPORT" \
              --unshare-all \
              --die-with-parent \
              --new-session \
              --chdir /tmp \
              -- "$@"
          }

          case "$CHECKER" in
            lean-paranoid)
              sandbox "$SYSROOT/bin/leanchecker-paranoid" \
                --silent --from-export "$EXPORT"
              ;;
            lean4lean)
              sandbox "$SYSROOT/bin/lean4lean" --import "$EXPORT"
              ;;
            con-leche)
              sandbox "$SYSROOT/bin/con-leche" "$EXPORT"
              ;;
            con-ron)
              sandbox "$SYSROOT/bin/con-ron" "$EXPORT"
              ;;
            *)
              echo "Unknown bundled checker: $CHECKER" >&2
              exit 2
              ;;
          esac


  nanoda-replay:
    needs: build
    name: bundled-checker (nanoda isolated)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan and pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Download proof export
        uses: actions/download-artifact@v5
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export

      - name: Install Bubblewrap and enable swap diagnostics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l \
            apt-get install -yq bubblewrap apparmor apparmor-utils apparmor-profiles time

          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if [ -f "$profile" ]; then
            sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true

          echo "=== resources before swap ==="
          free -h
          df -h /
          echo "memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo unavailable)"
          echo "memory.swap.max=$(cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || echo unavailable)"
          echo "memory.events:"
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true

          echo "Adding dedicated 16 GiB swap for nanoda in addition to any runner swap"
          sudo fallocate -l 16G /swapfile-nanoda
          sudo chmod 600 /swapfile-nanoda
          sudo mkswap /swapfile-nanoda
          sudo swapon /swapfile-nanoda
          sudo sysctl vm.swappiness=90 || true

          echo "=== resources after dedicated swap ==="
          free -h
          swapon --show
          df -h /

      - name: Replay exact export with nanoda and resource telemetry
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          SYSROOT="$(dirname "$(dirname "$(elan which lean)")")"
          EXPORT="$(realpath proof-export/solution.export)"
          CONFIG="$(pwd)/proof-export/nanoda.json"
          TIMELOG="$(pwd)/proof-export/nanoda-time.txt"
          TELEMETRY="$(pwd)/proof-export/nanoda-telemetry.txt"

          python3 -c 'import json,sys; export_path,config_path=sys.argv[1],sys.argv[2]; json.dump({"use_stdin":False,"export_file_path":export_path,"permitted_axioms":["propext","Classical.choice","Quot.sound","Lean.trustCompiler"],"unpermitted_axiom_hard_error":False,"num_threads":1,"nat_extension":True,"string_extension":True,"print_success_message":True}, open(config_path,"w",encoding="utf-8"))' "$EXPORT" "$CONFIG"
          CONFIG="$(realpath "$CONFIG")"

          echo "export bytes=$(wc -c < "$EXPORT")"
          echo "nanoda config:"
          cat "$CONFIG"

          set +e
          /usr/bin/time -v -o "$TIMELOG" \
            bwrap \
              --ro-bind / / \
              --tmpfs /home \
              --tmpfs /root \
              --tmpfs /run/user \
              --tmpfs /tmp \
              --dir /tmp/home \
              --dev /dev \
              --proc /proc \
              --clearenv \
              --setenv HOME /tmp/home \
              --setenv LEAN_ABORT_ON_PANIC 1 \
              --ro-bind "$SYSROOT" "$SYSROOT" \
              --ro-bind "$EXPORT" "$EXPORT" \
              --ro-bind "$CONFIG" "$CONFIG" \
              --unshare-all \
              --die-with-parent \
              --new-session \
              --chdir /tmp \
              -- "$SYSROOT/bin/nanoda_bin" "$CONFIG" &
          checker_pid=$!

          (
            while kill -0 "$checker_pid" 2>/dev/null; do
              echo "=== $(date -u +%FT%TZ) ==="
              free -m
              echo "cgroup memory.current=$(cat /sys/fs/cgroup/memory.current 2>/dev/null || echo unavailable)"
              echo "cgroup memory.peak=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
              echo "cgroup memory.swap.current=$(cat /sys/fs/cgroup/memory.swap.current 2>/dev/null || echo unavailable)"
              echo "cgroup memory.events:"
              cat /sys/fs/cgroup/memory.events 2>/dev/null || true
              ps -eo pid,ppid,rss,vsz,comm --sort=-rss | head -12
              sleep 15
            done
          ) | tee "$TELEMETRY" &
          monitor_pid=$!

          wait "$checker_pid"
          rc=$?
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          set -e

          echo "=== nanoda resource summary ==="
          cat "$TIMELOG" || true
          echo "=== final memory events ==="
          cat /sys/fs/cgroup/memory.events 2>/dev/null || true
          exit "$rc"

      - name: Upload nanoda diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanoda-diagnostics-${{ github.sha }}
          path: |
            proof-export/nanoda-time.txt
            proof-export/nanoda-telemetry.txt
          if-no-files-found: warn
