name: Lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject unfinished or project-local axiom declarations
        run: python3 .github/scripts/audit_lean_sources.py

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit v1.0 core theorem names and axioms
        run: lake env lean DistinctionSelfReference/FreezeAudit.lean

      - name: Export checked root module once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof-export
          lake env leanexport DistinctionSelfReference > proof-export/solution.export
          test -s proof-export/solution.export

      - name: Upload proof export
        uses: actions/upload-artifact@v4
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export/solution.export
          if-no-files-found: error
          compression-level: 1

  kernel-replay:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download proof export
        uses: actions/download-artifact@v5
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export

      - name: Install restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true

      - name: Kernel replay from exact build export
        run: lake check --from-export=proof-export/solution.export

  paranoid-replay:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download proof export
        uses: actions/download-artifact@v5
        with:
          name: proof-export-${{ github.sha }}
          path: proof-export

      - name: Install restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq bubblewrap apparmor apparmor-utils apparmor-profiles
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / /bin/true

      - name: Paranoid independent replay from exact build export
        run: lake check --from-export=proof-export/solution.export --paranoid
