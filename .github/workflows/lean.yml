name: Lean

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject unfinished or project-local axiom declarations
        run: python3 scripts/source_audit.py

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: lake update

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Audit v1.0 core theorem names and axioms
        run: lake env lean DistinctionSelfReference/FreezeAudit.lean

  proof-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install proof-check sandbox
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bubblewrap
          fi
          bwrap --version
          if ! bwrap --unshare-user --uid 0 --gid 0 \
              --ro-bind / / --proc /proc --dev /dev /bin/true; then
            echo "Unprivileged user namespaces are unavailable; enabling the setuid-root mode supported by bubblewrap."
            sudo chown root:root "$(command -v bwrap)"
            sudo chmod u+s "$(command -v bwrap)"
            bwrap --unshare-user --uid 0 --gid 0 \
              --ro-bind / / --proc /proc --dev /dev /bin/true
          fi

      - name: Resolve dependencies and create manifest
        run: lake update

      - name: Kernel replay
        run: lake check

      - name: Paranoid independent replay
        run: lake check --paranoid
